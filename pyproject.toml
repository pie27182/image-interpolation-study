[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "image-interpolation-study"
version = "0.2.0"
description = "Исследовательский проект по реализации классической интерполяции изображений с математических первых принципов."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Image Interpolation Study" }]
dependencies = [
  "numpy>=1.24",
  "Pillow>=10.0",  # только ввод-вывод файлов изображений и необязательная библиотечная базовая реализация
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.5"]
plots = ["matplotlib>=3.8"]

[project.scripts]
image-interpolation = "interpolation_study.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
