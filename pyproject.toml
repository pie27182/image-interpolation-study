[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "image-interpolation-study"
version = "0.1.0"
description = "A comparative study of image interpolation: Pillow baselines and NumPy implementations from first principles."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Image Interpolation Study" }]
dependencies = [
  "numpy>=1.24",
  "Pillow>=10.0",
  "scikit-image>=0.22",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.5"]

[project.scripts]
image-interpolation = "interpolation_study.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
